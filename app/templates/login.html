{% extends "base.html" %}
{% block title %}Login — Lab Management{% endblock %}
{% block login_content %}
<div class="login-card">
    <div class="login-header">
        <h1>🔬 Lab Management</h1>
        <p>Sign in to access the lab portal</p>
    </div>
    <form method="post" action="/login">
        <div class="form-group">
            <label for="student_id">Student ID / Username</label>
            <input type="text" id="student_id" name="student_id" placeholder="e.g., 22EC045" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
</div>
{% endblock %}
